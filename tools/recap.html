<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シーズン結果発表画像メーカー | しりすこPAD GB</title>
<!--
  運営用: SNS投稿向けの「シーズン結果発表」画像を作る (閲覧専用のワークベンチ)。
  デザインはシェアカード (js/sharecard.js) と同じ言語 — 暗色カード + 属性色 + 自作キャラタイル。

  ① 属性別の中央値 + 中央値が高かった編成 … 公開RPC (get_distribution / get_comp_insights) から自動取得
  ② 属性別の最高記録 + 編成 … **公開していないデータ**なので Supabase SQL Editor の結果を貼り付ける
     (最高値は「境界内の1票で乗っ取れる」ため公開集計から外してある — 08_shadow_stats.sql 参照。
      発表に使う前に、貼り付けた上位5件を見て不自然な値でないか必ず目視すること)

  使い方: ローカルで開く (python -m http.server → /tools/recap.html)。
  「画像を保存」で PNG が落ちる。キャラは自作タイル表示 (権利方針によりゲーム画像は不使用)。
-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
    body { margin:0; background:#0C0C0A; color:#F2F2EE; font-family:'Poppins','Noto Sans JP',sans-serif; padding:20px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p.note { font-size:12px; color:#93938C; line-height:1.7; margin:0 0 16px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    button { background:#EFDD3C; color:#2A2708; border:none; border-radius:999px; padding:9px 18px;
             font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    button.sub { background:#1F1F1C; color:#F2F2EE; }
    textarea { width:100%; height:150px; background:#171715; color:#F2F2EE; border:1px solid #2A2A26;
               border-radius:10px; padding:10px; font-family:monospace; font-size:11px; }
    canvas { max-width:100%; border-radius:12px; margin-top:8px; }
    .status { font-size:12px; color:#EFDD3C; min-height:18px; }
    h2 { font-size:14px; margin:26px 0 6px; }
</style>
</head>
<body>
<h1>🏁 シーズン結果発表 画像メーカー</h1>
<p class="note">
    シェアカードと同じデザインで、SNS投稿用の結果画像を作ります。キャラは自作タイル表示です
    (権利方針によりゲーム画像は使用しません)。
</p>

<div class="row">
    <label>シーズン <input id="season" value="2026-08" style="background:#171715;color:#F2F2EE;border:1px solid #2A2A26;border-radius:8px;padding:6px 10px;font:inherit;width:110px;"></label>
    <button onclick="build1()">① 中央値カードを作る</button>
    <button class="sub" onclick="save('c1','shirisuko-recap-median')">画像を保存</button>
</div>
<div class="status" id="s1"></div>
<canvas id="c1" width="1200" height="800"></canvas>

<h2>② 最高記録カード</h2>
<p class="note">
    最高値は公開集計に含めていないため、Supabase の SQL Editor で下のクエリを実行し、結果 (JSON) を貼り付けてください。<br>
    <b>発表前に必ず上位を目視し、不自然な値が混ざっていないか確認すること。</b>
</p>
<textarea id="sql" readonly></textarea>
<div class="row">
    <button class="sub" onclick="copySql()">クエリをコピー</button>
</div>
<textarea id="paste" placeholder="SQL Editor の結果 (JSON) をここに貼り付け"></textarea>
<div class="row">
    <button onclick="build2()">② 最高記録カードを作る</button>
    <button class="sub" onclick="save('c2','shirisuko-recap-top')">画像を保存</button>
</div>
<div class="status" id="s2"></div>
<canvas id="c2" width="1200" height="800"></canvas>

<script type="module">
import { ATTR_INFO, SITE_URL } from '../js/shared.js';
import { makeCharResolver, drawTileCanvas, sortForDisplay } from '../js/tiles.js';

const F = "'Poppins', 'Noto Sans JP', sans-serif";
const INK = '#14161A', CREAM = '#F6F1CD';
const ATTRS = ['FIRE', 'WATER', 'ELECTRIC', 'IRON', 'WIND'];

const SQL = `-- 属性別の最高記録 上位5件 (発表前の目視用)。SQL Editor で実行し、結果をJSONで貼り付ける
with b as (
  select coalesce(sb.min_score, 0.01) mn, coalesce(sb.max_score, 5.0) mx
  from (select 1) o left join public.score_bounds sb on sb.season = :season
), best as (
  select distinct on (m.client_id, m.attribute)
         m.attribute, m.client_id, m.slv, m.damage, m.score, m.characters
  from public.measurements m, b
  where m.season = :season and not m.is_finish
    and m.score between b.mn and b.mx
  order by m.client_id, m.attribute, m.score desc
), ranked as (
  select *, row_number() over (partition by attribute order by score desc) rn from best
)
select attribute, rn, round(score, 3) as score, round(damage / 1e9, 2) as damage_b,
       slv, characters
from ranked where rn <= 5 order by attribute, rn;`;

let charData = null, infoOf = () => null, base = null, raid = null, logo = null;

async function boot() {
    const [c, b2, r] = await Promise.all([
        fetch('../data/characters.json').then(x => x.json()).catch(() => null),
        fetch('../data/base.json').then(x => x.json()).catch(() => null),
        fetch('../data/raid.json').then(x => x.json()).catch(() => null),
    ]);
    charData = c; infoOf = makeCharResolver(c); base = b2; raid = r;
    if (b2?.version) document.getElementById('season').value = b2.version;
    document.getElementById('sql').value = SQL.replaceAll(':season', `'${document.getElementById('season').value}'`);
    logo = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = '../assets/union-logo.png'; });
}
window.copySql = () => {
    const el = document.getElementById('sql');
    el.value = SQL.replaceAll(':season', `'${document.getElementById('season').value}'`);
    navigator.clipboard.writeText(el.value); el.select();
};
window.save = (id, name) => {
    const a = document.createElement('a');
    a.download = `${name}-${document.getElementById('season').value}.png`;
    a.href = document.getElementById(id).toDataURL('image/png');
    a.click();
};

// ---- 共通の下地 (シェアカードと同じ構図) ----
function frame(ctx, W, H, title, sub) {
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
    const bar = ATTRS.map(a => ATTR_INFO[a].color).concat(CREAM);
    const seg = W / bar.length;
    bar.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * seg, 0, seg + 1, 14); });
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8A9097'; ctx.font = `800 28px ${F}`;
    ctx.fillText('SHIRISUKO PAD GB', 70, 90);
    if (logo) {
        const lh = 56, lw = Math.round(lh * logo.width / logo.height), lx = W - 70 - lw;
        ctx.drawImage(logo, lx, 90 - lh + 14, lw, lh);
        ctx.fillStyle = '#8A9097'; ctx.font = `700 22px ${F}`; ctx.textAlign = 'right';
        ctx.fillText('Developed by', lx - 16, 84); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#FFFFFF'; ctx.font = `800 46px ${F}`;
    ctx.fillText(title, 70, 168);
    const tw = ctx.measureText(title).width;
    ctx.fillStyle = '#8A9097'; ctx.font = `700 21px ${F}`;
    ctx.fillText(sub, 70 + tw + 28, 164);
    // 権利表記
    ctx.fillStyle = '#6B7178'; ctx.font = `700 17px ${F}`;
    ctx.fillText('非公式ファンコンテンツ | 勝利の女神：NIKKE © SHIFT UP CORP.', 70, H - 34);
    ctx.font = `700 24px ${F}`; ctx.textAlign = 'right';
    ctx.fillText(SITE_URL.replace('https://', '').replace(/\/$/, ''), W - 70, H - 34);
    ctx.textAlign = 'left';
}

// 5属性の行レイアウト (列だとタイルが小さすぎてSNSで読めないため行に — 実機判断)
// drawRow(attr, y, h) が1行ぶんを描く。左に属性+数値、右に編成タイル。
const ROW_TOP = 238, ROW_H = 94;
function rows(ctx, W, drawRow) {
    ATTRS.forEach((attr, i) => {
        const y = ROW_TOP + i * ROW_H;
        if (i > 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(70, y - 8); ctx.lineTo(W - 70, y - 8); ctx.stroke();
        }
        drawRow(attr, y, ROW_H);
    });
}

// 編成5体を横一列のタイルで (自作タイル — ゲーム画像は使わない)。戻り値は使った幅
function drawTeam(ctx, ids, x0, y, ts = 64) {
    if (!Array.isArray(ids) || ids.length === 0) return 0;
    const gap = 5;
    sortForDisplay(ids, infoOf).forEach((id, i) => {
        drawTileCanvas(ctx, infoOf(id), x0 + i * (ts + gap), y, ts, F, null);
    });
    return ids.length * (ts + gap) - gap;
}

const rpc = async (fn, body) => {
    const src = await fetch('../js/backend.js').then(r => r.text());
    const URL_ = src.match(/https:\/\/[a-z]+\.supabase\.co/)[0];
    const KEY = src.match(/sb_publishable_[A-Za-z0-9_-]+/)[0];
    const res = await fetch(`${URL_}/rest/v1/rpc/${fn}`, {
        method: 'POST', headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`${fn}: ${res.status}`);
    return res.json();
};

// ---- ① 中央値カード ----
window.build1 = async () => {
    const season = document.getElementById('season').value.trim();
    const st = document.getElementById('s1');
    st.textContent = '取得中…';
    try {
        const data = {};
        let users = 0, totalN = 0;
        for (const a of ATTRS) {
            const [d, ins] = await Promise.all([
                rpc('get_distribution', { p_attribute: a, p_season: season, p_score: 1 }),
                rpc('get_comp_insights', { p_attribute: a, p_season: season }),
            ]);
            data[a] = { n: d.n || 0, median: d.median, top: (ins.medianTop || [])[0] || null };
            totalN += d.n || 0;
        }
        try { users = (await rpc('get_total_distribution', { p_season: season }))?.users || 0; } catch { /* 11未適用 */ }
        await document.fonts.ready;
        const cv = document.getElementById('c1'), ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        frame(ctx, W, H, `${season} 結果発表`,
            `利用者 ${users}人 · のべ ${totalN}件の提出`);
        ctx.fillStyle = '#A4AAB0'; ctx.font = `700 19px ${F}`;
        ctx.fillText('属性ごとの「みんなの真ん中」と、中央値がいちばん高かった編成', 70, 196);
        // 見出し
        ctx.fillStyle = '#6B7178'; ctx.font = `800 14px ${F}`;
        ctx.fillText('中央値', 190, 224);
        ctx.fillText('中央値が高かった編成', 470, 224);
        rows(ctx, W, (attr, y) => {
            const d = data[attr], info = ATTR_INFO[attr];
            const cy = y + 46;   // 行の視覚的な中心
            ctx.fillStyle = info.color; ctx.font = `800 22px ${F}`;
            ctx.fillText(`${info.jp}PT`, 70, cy - 6);
            ctx.fillStyle = '#8A9097'; ctx.font = `700 15px ${F}`;
            ctx.fillText(`${d.n}件`, 70, cy + 20);
            // 中央値 (主役)
            ctx.fillStyle = '#FFFFFF'; ctx.font = `800 46px ${F}`;
            ctx.fillText(Number.isFinite(d.median) ? d.median.toFixed(2) : '—', 190, cy + 12);
            if (d.top) {
                drawTeam(ctx, d.top.chars, 470, y + 10, 64);
                ctx.fillStyle = info.color; ctx.font = `800 30px ${F}`;
                ctx.fillText(Number(d.top.median).toFixed(2), 900, cy + 4);
                ctx.fillStyle = '#8A9097'; ctx.font = `700 15px ${F}`;
                ctx.fillText(`採用 ${d.top.n}人`, 900, cy + 26);
            } else {
                ctx.fillStyle = '#6B7178'; ctx.font = `700 17px ${F}`;
                ctx.fillText('データ不足', 470, cy + 6);
            }
        });
        ctx.fillStyle = '#6B7178'; ctx.font = `700 16px ${F}`;
        ctx.fillText('中央値 = 提出のちょうど真ん中。1端末1票・締め凸と極端な値は除外。編成は採用5人以上が対象', 70, 738);
        st.textContent = '✅ 作成しました';
    } catch (e) { st.textContent = '❌ ' + (e?.message || e); }
};

// ---- ② 最高記録カード ----
window.build2 = async () => {
    const season = document.getElementById('season').value.trim();
    const st = document.getElementById('s2');
    let rows;
    try {
        rows = JSON.parse(document.getElementById('paste').value);
        if (!Array.isArray(rows)) throw new Error('配列ではありません');
    } catch (e) { st.textContent = '❌ 貼り付けたJSONを読めません: ' + (e?.message || e); return; }
    const top = {};
    rows.forEach(r => {
        const a = String(r.attribute || '').toUpperCase();
        if (!ATTRS.includes(a)) return;
        if (Number(r.rn) !== 1) return;   // 1位だけ使う (2〜5位は目視用)
        top[a] = r;
    });
    await document.fonts.ready;
    const cv = document.getElementById('c2'), ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    frame(ctx, W, H, `${season} 最高記録`, '属性ごとのトップと、その編成');
    ctx.fillStyle = '#A4AAB0'; ctx.font = `700 19px ${F}`;
    ctx.fillText('提出のなかで最も高いふるり値を記録した凸と、その編成', 70, 196);
    ctx.fillStyle = '#6B7178'; ctx.font = `800 14px ${F}`;
    ctx.fillText('最高ふるり値', 190, 224);
    ctx.fillText('その記録の編成', 470, 224);
    rows(ctx, W, (attr, y) => {
        const r = top[attr], info = ATTR_INFO[attr];
        const cy = y + 46;
        ctx.fillStyle = info.color; ctx.font = `800 22px ${F}`;
        ctx.fillText(`${info.jp}PT`, 70, cy - 6);
        if (!r) { ctx.fillStyle = '#6B7178'; ctx.font = `700 17px ${F}`; ctx.fillText('データなし', 190, cy + 6); return; }
        ctx.fillStyle = '#8A9097'; ctx.font = `700 15px ${F}`;
        ctx.fillText(`SLv ${r.slv}`, 70, cy + 20);
        ctx.fillStyle = '#FFFFFF'; ctx.font = `800 46px ${F}`;
        ctx.fillText(Number(r.score).toFixed(2), 190, cy + 12);
        ctx.fillStyle = '#A4AAB0'; ctx.font = `700 17px ${F}`;
        ctx.fillText(`${Number(r.damage_b).toFixed(2)} B`, 330, cy + 8);
        const ids = Array.isArray(r.characters) ? r.characters : [];
        if (ids.length) drawTeam(ctx, ids, 470, y + 10, 64);
        else { ctx.fillStyle = '#6B7178'; ctx.font = `700 17px ${F}`; ctx.fillText('編成の登録なし', 470, cy + 6); }
    });
    ctx.fillStyle = '#6B7178'; ctx.font = `700 16px ${F}`;
    ctx.fillText('1端末1票・締め凸と極端な値は除外。自己申告のダメージのため参考値です', 70, 738);
    st.textContent = '✅ 作成しました';
};

// 自動生成モード (headless Chrome での書き出し用):
//   ?auto=median … ①を描画   ?auto=top&data=<JSON> … ②を描画   &bare=1 … カード以外を隠す
(async () => {
    const q = new URLSearchParams(location.search);
    const auto = q.get('auto');
    if (!auto) return;
    if (q.get('season')) document.getElementById('season').value = q.get('season');
    if (q.get('bare')) {
        document.body.style.padding = '0';
        document.querySelectorAll('body > *:not(canvas)').forEach(el => { el.style.display = 'none'; });
        document.querySelectorAll('canvas').forEach(c => { c.style.display = 'none'; c.style.borderRadius = '0'; c.style.margin = '0'; });
        const keep = document.getElementById(auto === 'top' ? 'c2' : 'c1');
        keep.style.display = 'block';
    }
    if (auto === 'top' && q.get('data')) document.getElementById('paste').value = decodeURIComponent(q.get('data'));
    await (auto === 'top' ? window.build2() : window.build1());
})();

boot().then(() => {
    // boot 完了後に auto を回すため、上の即時実行とは別に再試行 (順序ガード)
    const q = new URLSearchParams(location.search);
    if (!q.get('auto')) return;
    const cv = document.getElementById(q.get('auto') === 'top' ? 'c2' : 'c1');
    const ctx = cv.getContext('2d');
    const blank = !ctx.getImageData(0, 0, 1, 1).data[3];
    if (blank) (q.get('auto') === 'top' ? window.build2() : window.build1());
});
</script>
</body>
</html>
