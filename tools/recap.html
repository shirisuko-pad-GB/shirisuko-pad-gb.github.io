<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シーズン結果発表画像メーカー | しりすこPAD GB</title>
<!--
  運営用: SNS投稿向けの「シーズン結果発表」画像を作る (閲覧専用のワークベンチ)。
  デザインはシェアカード (js/sharecard.js) と同じ言語 — 暗色カード + 属性色 + 自作キャラタイル。

  ① 属性別の中央値 + 中央値が高かった編成
  ② 属性別の使用率が高かった編成
  どちらも公開RPC (get_distribution / get_comp_insights) の集計値だけを使う。

  ⚠ 個人の記録 (最高ダメージ等) は載せない — 運営判断 2026-08-10。
     ダメージ+SLv+編成が揃うと個人が特定され得るため、集計値 (中央値・採用率) のみ扱う。
     この方針を破る改造をしないこと。

  使い方: ローカルで開く (python -m http.server → /tools/recap.html)。
  「画像を保存」で PNG が落ちる。キャラは自作タイル表示 (権利方針によりゲーム画像は不使用)。
  headless 書き出し: ?auto=median|usage&bare=1
-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
    body { margin:0; background:#0C0C0A; color:#F2F2EE; font-family:'Poppins','Noto Sans JP',sans-serif; padding:20px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p.note { font-size:12px; color:#93938C; line-height:1.7; margin:0 0 16px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    button { background:#EFDD3C; color:#2A2708; border:none; border-radius:999px; padding:9px 18px;
             font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    button.sub { background:#1F1F1C; color:#F2F2EE; }
    canvas { max-width:100%; border-radius:12px; margin-top:8px; }
    .status { font-size:12px; color:#EFDD3C; min-height:18px; }
    h2 { font-size:14px; margin:26px 0 6px; }
</style>
</head>
<body>
<h1>🏁 シーズン結果発表 画像メーカー</h1>
<p class="note">
    シェアカードと同じデザインで、SNS投稿用の結果画像を作ります。キャラは自作タイル表示です
    (権利方針によりゲーム画像は使用しません)。<br>
    <b>集計値のみを扱います</b> — 個人の記録 (最高ダメージ等) は特定につながるため載せません。
</p>

<div class="row">
    <label>シーズン <input id="season" value="2026-08" style="background:#171715;color:#F2F2EE;border:1px solid #2A2A26;border-radius:8px;padding:6px 10px;font:inherit;width:110px;"></label>
    <button onclick="buildBoth()">2枚まとめて作る</button>
    <label style="font-size:12px;color:#93938C;"><input type="checkbox" id="useArt"> キャラ絵を使う (ローカル専用・公開前に要許諾)</label>
</div>

<h2>① 中央値が高かった編成</h2>
<div class="row">
    <button class="sub" onclick="build('median')">作り直す</button>
    <button class="sub" onclick="save('c1','shirisuko-recap-median')">画像を保存</button>
</div>
<div class="status" id="s1"></div>
<canvas id="c1" width="1200" height="800"></canvas>

<h2>② 使用率が高かった編成</h2>
<div class="row">
    <button class="sub" onclick="build('usage')">作り直す</button>
    <button class="sub" onclick="save('c2','shirisuko-recap-usage')">画像を保存</button>
</div>
<div class="status" id="s2"></div>
<canvas id="c2" width="1200" height="800"></canvas>

<script type="module">
import { ATTR_INFO, SITE_URL } from '../js/shared.js';
import { makeCharResolver, drawTileCanvas, sortForDisplay } from '../js/tiles.js';

const F = "'Poppins', 'Noto Sans JP', sans-serif";
const INK = '#14161A', CREAM = '#F6F1CD';
const ATTRS = ['FIRE', 'WATER', 'ELECTRIC', 'IRON', 'WIND'];

let infoOf = () => null, logo = null, booted = null;

function boot() {
    if (booted) return booted;
    booted = (async () => {
        const [c, b] = await Promise.all([
            fetch('../data/characters.json').then(x => x.json()).catch(() => null),
            fetch('../data/base.json').then(x => x.json()).catch(() => null),
        ]);
        infoOf = makeCharResolver(c);
        if (b?.version && !new URLSearchParams(location.search).get('season')) {
            document.getElementById('season').value = b.version;
        }
        logo = await new Promise(res => {
            const i = new Image();
            i.onload = () => res(i); i.onerror = () => res(null);
            i.src = '../assets/union-logo.png';
        });
    })();
    return booted;
}
window.save = (id, name) => {
    const a = document.createElement('a');
    a.download = `${name}-${document.getElementById('season').value}.png`;
    a.href = document.getElementById(id).toDataURL('image/png');
    a.click();
};

// ---- 共通の下地 (シェアカードと同じ構図) ----
function frame(ctx, W, H, title, sub, lead) {
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
    const bar = ATTRS.map(a => ATTR_INFO[a].color).concat(CREAM);
    const seg = W / bar.length;
    bar.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * seg, 0, seg + 1, 14); });
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8A9097'; ctx.font = `800 28px ${F}`;
    ctx.fillText('SHIRISUKO PAD GB', 70, 90);
    if (logo) {
        const lh = 56, lw = Math.round(lh * logo.width / logo.height), lx = W - 70 - lw;
        ctx.drawImage(logo, lx, 90 - lh + 14, lw, lh);
        ctx.fillStyle = '#8A9097'; ctx.font = `700 22px ${F}`; ctx.textAlign = 'right';
        ctx.fillText('Developed by', lx - 16, 84); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#FFFFFF'; ctx.font = `800 46px ${F}`;
    ctx.fillText(title, 70, 168);
    const tw = ctx.measureText(title).width;
    ctx.fillStyle = '#8A9097'; ctx.font = `700 21px ${F}`;
    ctx.fillText(sub, 70 + tw + 28, 164);
    ctx.fillStyle = '#A4AAB0'; ctx.font = `700 19px ${F}`;
    ctx.fillText(lead, 70, 196);
    ctx.fillStyle = '#6B7178'; ctx.font = `700 17px ${F}`;
    ctx.fillText('非公式ファンコンテンツ | 勝利の女神：NIKKE © SHIFT UP CORP.', 70, H - 34);
    ctx.font = `700 24px ${F}`; ctx.textAlign = 'right';
    ctx.fillText(SITE_URL.replace('https://', '').replace(/\/$/, ''), W - 70, H - 34);
    ctx.textAlign = 'left';
}

// 5属性の行レイアウト (列だとタイルが小さすぎてSNSで読めないため行に)
const ROW_TOP = 238, ROW_H = 94;
function rows(ctx, W, drawRow) {
    ATTRS.forEach((attr, i) => {
        const y = ROW_TOP + i * ROW_H;
        if (i > 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(70, y - 8); ctx.lineTo(W - 70, y - 8); ctx.stroke();
        }
        drawRow(attr, y);
    });
}

// キャラ絵つきモード (?art=1 またはチェックボックス)。
// ⚠ サイト本体は掲載停止中 (USE_CHAR_IMAGES=false)。ここは**この画像を作るときだけ**の経路で、
//    参照先は gitignore 済みの character-images-local/ (リポジトリには入らない)。
//    権利元の許諾が出るまで、生成した画像を公開しないこと (運営判断 2026-08-10)。
const CHAR_ID_RE = /^[0-9a-f]{32}\.webp$/;
const faceCache = new Map();
function useArt() {
    const q = new URLSearchParams(location.search).get('art');
    if (q != null) return q === '1';
    return !!document.getElementById('useArt')?.checked;
}
function loadFace(id) {
    if (!CHAR_ID_RE.test(id || '')) return Promise.resolve(null);
    if (faceCache.has(id)) return faceCache.get(id);
    const p = new Promise(res => {
        const im = new Image();
        im.onload = () => res(im); im.onerror = () => res(null);
        im.src = `../character-images-local/${id}`;
    });
    faceCache.set(id, p);
    return p;
}
// 使う編成のキャラ絵を先読み (Canvas 描画は同期のため)
async function preloadFaces(comps) {
    if (!useArt()) return new Map();
    const ids = [...new Set(comps.flatMap(c => c?.chars || []).map(id => infoOf(id)?.id).filter(Boolean))];
    const out = new Map();
    await Promise.all(ids.map(async id => { const im = await loadFace(id); if (im) out.set(id, im); }));
    return out;
}

// 編成5体を横一列のタイルで (既定は自作タイル。faces があれば顔絵を載せる)
function drawTeam(ctx, ids, x0, y, ts = 64, faces = null) {
    if (!Array.isArray(ids) || ids.length === 0) return;
    const gap = 5;
    sortForDisplay(ids, infoOf).forEach((id, i) => {
        const info = infoOf(id);
        drawTileCanvas(ctx, info, x0 + i * (ts + gap), y, ts, F, faces?.get(info?.id) ?? null);
    });
}

const rpc = async (fn, body) => {
    const src = await fetch('../js/backend.js').then(r => r.text());
    const URL_ = src.match(/https:\/\/[a-z]+\.supabase\.co/)[0];
    const KEY = src.match(/sb_publishable_[A-Za-z0-9_-]+/)[0];
    const res = await fetch(`${URL_}/rest/v1/rpc/${fn}`, {
        method: 'POST', headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`${fn}: ${res.status}`);
    return res.json();
};

// 5属性ぶんの集計をまとめて取る
async function fetchAll(season) {
    const data = {};
    let totalN = 0, users = 0;
    for (const a of ATTRS) {
        const [d, ins] = await Promise.all([
            rpc('get_distribution', { p_attribute: a, p_season: season, p_score: 1 }),
            rpc('get_comp_insights', { p_attribute: a, p_season: season }),
        ]);
        data[a] = {
            n: d.n || 0,
            median: d.median,
            cohort: ins.n || 0,                        // 編成つき提出の母数
            byMedian: (ins.medianTop || [])[0] || null, // 中央値TOP
            byUsage: (ins.comps || [])[0] || null,      // 使用率TOP
        };
        totalN += d.n || 0;
    }
    try { users = (await rpc('get_total_distribution', { p_season: season }))?.users || 0; } catch { /* 11未適用 */ }
    return { data, totalN, users };
}

window.build = async (kind) => {
    await boot();
    const season = document.getElementById('season').value.trim();
    const st = document.getElementById(kind === 'usage' ? 's2' : 's1');
    st.textContent = '取得中…';
    try {
        const { data, totalN, users } = await fetchAll(season);
        const usageMode = kind === 'usage';
        const faces = await preloadFaces(ATTRS.map(a => usageMode ? data[a].byUsage : data[a].byMedian));
        await document.fonts.ready;
        const cv = document.getElementById(kind === 'usage' ? 'c2' : 'c1');
        const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
        const usage = kind === 'usage';
        frame(ctx, W, H,
            usage ? `${season} よく使われた編成` : `${season} 結果発表`,
            `利用者 ${users}人 · のべ ${totalN}件の提出`,
            usage ? '属性ごとに、いちばん多くの人が使っていた編成'
                  : '属性ごとの「みんなの真ん中」と、中央値がいちばん高かった編成');
        ctx.fillStyle = '#6B7178'; ctx.font = `800 14px ${F}`;
        ctx.fillText(usage ? '採用率' : '中央値', 190, 224);
        ctx.fillText(usage ? 'いちばん使われた編成' : '中央値が高かった編成', 470, 224);
        rows(ctx, W, (attr, y) => {
            const d = data[attr], info = ATTR_INFO[attr];
            const cy = y + 46;
            const comp = usage ? d.byUsage : d.byMedian;
            ctx.fillStyle = info.color; ctx.font = `800 22px ${F}`;
            ctx.fillText(`${info.jp}PT`, 70, cy - 6);
            ctx.fillStyle = '#8A9097'; ctx.font = `700 15px ${F}`;
            ctx.fillText(usage ? `編成つき ${d.cohort}件` : `${d.n}件`, 70, cy + 20);
            // 主役の数値
            ctx.fillStyle = '#FFFFFF'; ctx.font = `800 46px ${F}`;
            if (usage) {
                const pct = comp && d.cohort > 0 ? Math.round(comp.n / d.cohort * 100) : null;
                ctx.fillText(pct != null ? `${pct}%` : '—', 190, cy + 12);
            } else {
                ctx.fillText(Number.isFinite(d.median) ? d.median.toFixed(2) : '—', 190, cy + 12);
            }
            if (!comp) {
                ctx.fillStyle = '#6B7178'; ctx.font = `700 17px ${F}`;
                ctx.fillText('データ不足', 470, cy + 6);
                return;
            }
            drawTeam(ctx, comp.chars, 470, y + 10, 64, faces);
            // 右肩の補足
            if (usage) {
                ctx.fillStyle = info.color; ctx.font = `800 26px ${F}`;
                ctx.fillText(`${comp.n}人`, 900, cy + 4);
                ctx.fillStyle = '#8A9097'; ctx.font = `700 15px ${F}`;
                ctx.fillText(Number.isFinite(comp.median) ? `中央値 ${Number(comp.median).toFixed(2)}` : '', 900, cy + 26);
            } else {
                ctx.fillStyle = info.color; ctx.font = `800 30px ${F}`;
                ctx.fillText(Number(comp.median).toFixed(2), 900, cy + 4);
                ctx.fillStyle = '#8A9097'; ctx.font = `700 15px ${F}`;
                ctx.fillText(`採用 ${comp.n}人`, 900, cy + 26);
            }
        });
        ctx.fillStyle = '#6B7178'; ctx.font = `700 16px ${F}`;
        ctx.fillText(usage
            ? '採用率 = 編成を登録した提出のうち、その5人 (並び順は不問) を使っていた割合。1端末1票・締め凸と極端な値は除外'
            : '中央値 = 提出のちょうど真ん中。1端末1票・締め凸と極端な値は除外。編成は採用5人以上が対象', 70, 738);
        st.textContent = '✅ 作成しました';
    } catch (e) { st.textContent = '❌ ' + (e?.message || e); }
};
window.buildBoth = async () => { await window.build('median'); await window.build('usage'); };

// 自動生成モード (headless Chrome での書き出し用): ?auto=median|usage&bare=1
(async () => {
    const q = new URLSearchParams(location.search);
    const auto = q.get('auto');
    if (!auto) { boot(); return; }
    if (q.get('season')) document.getElementById('season').value = q.get('season');
    if (q.get('bare')) {
        document.body.style.padding = '0';
        document.querySelectorAll('body > *:not(canvas)').forEach(el => { el.style.display = 'none'; });
        document.querySelectorAll('canvas').forEach(c => { c.style.display = 'none'; c.style.borderRadius = '0'; c.style.margin = '0'; });
        document.getElementById(auto === 'usage' ? 'c2' : 'c1').style.display = 'block';
    }
    await window.build(auto === 'usage' ? 'usage' : 'median');
})();
</script>
</body>
</html>
