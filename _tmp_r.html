<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<script>
const q = new URLSearchParams(location.search);
const MODE = q.get('mode') || 'picker';
const LIGHT_CSS = ':root{--bg:#F4F4F1 !important;--card:#FFFFFF !important;--card2:#F7F7F4 !important;--ink:#141412 !important;--onink:#F7F7F4 !important;--sub:#7C7C76 !important;--sub2:#8A8A84 !important;--faint:#B9B9B2 !important;--line:rgba(20,20,18,0.08) !important;--cream:#F6F1CD !important;--cream-ink:#55511F !important;--chart-fill:rgba(20,20,18,0.07) !important;--tile-mix:#FFFFFF !important;--tile-tint:16% !important;--tile-ink:62% !important;--tile-ink-mix:#141412 !important;}';
(async () => {
  const src = await (await fetch('/index.html')).text();
  const patch = '<scr'+'ipt>localStorage.setItem("spg_client_id","dddddddd-dddd-4ddd-8ddd-ffffffffffff");localStorage.removeItem("spg_last_result");</scr'+'ipt>';
  const f = document.createElement('iframe');
  f.style.cssText = 'width:375px;height:2600px;border:0';
  f.srcdoc = src.replace('<head>', '<head>' + patch).replace('</head>', '<style>' + LIGHT_CSS + '</style></head>');
  document.body.appendChild(f);
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  await wait(2800);
  const fw = f.contentWindow, fd = fw.document;
  const set = (el, v) => { el.value = v; el.dispatchEvent(new fw.Event('input', {bubbles:true})); };
  set(fd.getElementById('slv'), 544);
  const card = (i) => fd.querySelectorAll('.atk-card')[i];
  const pick = async (i, attr, dmg) => {
    card(i).querySelector(`[data-attr="${attr}"]`).click(); await wait(250);
    set(card(i).querySelector('.atk-damage'), dmg);
  };
  await pick(0, 'ELECTRIC', '22.8');
  const det = card(0).querySelector('details.comp'); det.open = true; det.dispatchEvent(new Event('toggle'));
  await wait(400);
  if (MODE === 'picker') {
    // プリセットTOP5の2番目 (並び順が2種あるもの) をタップ → 配置選択が開く
    const rows = card(0).querySelectorAll('.preset-row');
    if (rows[1]) rows[1].click();
    await wait(400);
    window.scrollTo(0, f.offsetTop + card(0).offsetTop);
    return;
  }
  // MODE=result: 3凸入力して実送信 → 結果 + シェアカード保存プレビュー
  card(0).querySelector('.preset-row').click(); await wait(300);
  const openArr = card(0).querySelector('.arr-opt'); if (openArr) { openArr.click(); await wait(300); }
  fd.getElementById('addAtkBtn').click(); await wait(300);
  await pick(1, 'WIND', '12.1');
  fd.getElementById('addAtkBtn').click(); await wait(300);
  await pick(2, 'WATER', '14.9');
  fd.getElementById('submitBtn').click();
  await wait(6000);
  fd.getElementById('saveBtn').click();
  await wait(2000);
  fd.getElementById('measureArea').style.display = 'none';
  fd.getElementById('recruitArea').style.display = 'none';
  fd.querySelector('.about').style.display = 'none';
})();
</script></body>
